<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MSA Academy Manager — Sign in</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#061a32,#0b3151 60%,#08745d);font-family:Arial,sans-serif;color:#10213d}.box{width:min(92vw,390px);background:#fff;border-radius:22px;padding:30px;box-shadow:0 20px 60px #0005;text-align:center}.logo{width:70px;height:70px;object-fit:contain}.brand{font-size:22px;font-weight:900;color:#071b35;margin:10px 0 4px}.sub{font-size:11px;letter-spacing:2px;color:#0b6b4f;font-weight:900;margin-bottom:25px}input,button{width:100%;height:48px;box-sizing:border-box;border-radius:11px;font-size:15px}input{border:1px solid #ccd7e0;padding:0 14px}button{margin-top:10px;border:0;background:#0b6b4f;color:#fff;font-weight:900;cursor:pointer}.secondary{background:#edf2f6;color:#17314e}.msg{min-height:22px;font-size:13px;color:#72809a;margin-top:14px}.err{color:#c0392b}.role{font-size:12px;color:#72809a;margin-bottom:14px}</style></head><body><main class="box"><img class="logo" src="/msa-logo.svg"><div class="brand">MSA ACADEMY MANAGER</div><div class="sub">WHERE CHAMPS ARE MADE</div><div class="role">Sign in with your MSA Academy account</div><form id="f"><input id="email" type="email" autocomplete="username webauthn" placeholder="Email address" required><div id="codeBox" hidden><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code"></div><button id="go">Continue</button><button id="back" type="button" class="secondary" hidden>Use a different email</button></form><div id="msg" class="msg"></div></main><script>(async function(){const A=window.hatchable&&window.hatchable.auth, qs=new URLSearchParams(location.search),change=qs.get('account')==='change';const email=document.getElementById('email'),code=document.getElementById('code'),codeBox=document.getElementById('codeBox'),go=document.getElementById('go'),back=document.getElementById('back'),msg=document.getElementById('msg');function say(s,e){msg.textContent=s||'';msg.className='msg'+(e?' err':'')}function next(){let n=qs.get('next')||'/';return n.charAt(0)==='/'&&n.indexOf('//')!==0?n:'/'}if(!A){say('Authentication is unavailable. Refresh and try again.',true);return}if(change){try{if(A.signOut)await A.signOut();else if(A.logout)await A.logout()}catch(e){}history.replaceState({},'', '/login?next='+encodeURIComponent(next()))}else{try{const s=await A.getSession();if(s&&s.user){location.replace(next());return}}catch(e){}}let step='email';back.onclick=function(){step='email';codeBox.hidden=true;back.hidden=true;go.textContent='Continue';say('');email.focus()};document.getElementById('f').onsubmit=async function(ev){ev.preventDefault();go.disabled=true;say('');try{if(step==='email'){const em=email.value.trim();if(!em)throw Error('Enter your email address.');await A.startLogin({email:em});step='code';codeBox.hidden=false;back.hidden=false;go.textContent='Sign in';code.focus();say('Code sent to '+em+'.')}else{const d=await A.verifyCode({email:email.value.trim(),code:code.value.trim()});if(!d||!d.user)throw Error('That code did not work.');location.replace(next());return}}catch(e){say(e&&e.message||'Could not sign in. Please try again.',true)}finally{go.disabled=false}};email.focus()})();</script></body></html>
