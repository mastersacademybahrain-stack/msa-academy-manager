ius:9px;box-sizing:border-box}.session{padding:12px;background:#fafcfb;border-left:5px solid #0b6b4f;border-radius:10px;margin:8px 0}.pill{display:inline-block;padding:4px 8px;background:#e9f1ed;border-radius:12px;font-size:12px;margin:2px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.small{font-size:12px;color:#68746f}.check{display:flex;gap:8px;align-items:center;padding:8px;background:#f4f7f5;border-radius:9px;margin:5px 0}.check input{width:auto}.week{display:grid;grid-template-columns:repeat(7,minmax(145px,1fr));gap:8px;overflow-x:auto}.day{background:#f5f8f6;border-radius:12px;padding:10px;min-height:180px}.day h3{margin:4px 0 10px;font-size:14px}.day .session{background:#fff;cursor:pointer}.day .session:hover{transform:translateY(-1px)}.day .session.cat-red{background:#ffe5e5;border-left-color:#e53935}.day .session.cat-orange{background:#fff0df;border-left-color:#f28c28}.day .session.cat-green{background:#e4f6e9;border-left-color:#2e9d57}.day .session.cat-yellow{background:#fff9d6;border-left-color:#e0b400}.day .session.cat-veteran{background:#eee3fa;border-left-color:#7b3fb3}.day .session.cat-tennis{background:#eef5f1;border-left-color:#0b6b4f}@media(max-width:800px){.week{grid-template-columns:repeat(7,155px)}}</style></head><body><header><div class='brand'>MSA Academy</div><div>Where champions are made · Online Academy Manager</div></header><nav id='nav'></nav><main id='app'></main><script src='/app.js'></script></body></html>
